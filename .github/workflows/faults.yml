# Runs the fault-injection tests (tests/faults) against the nntp-testkit fake
# server. Not run on push or pull requests: start it from the Actions tab, or
# it runs weekly.

name: Faults

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  faults:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/faults/server/go.mod
          cache-dependency-path: tests/faults/server/go.sum
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Build the fault server
        working-directory: tests/faults/server
        run: go build -o "$RUNNER_TEMP/faultserver" .
      - name: Run the fault tests
        env:
          PYNNTP_FAULT_SERVER: ${{ runner.temp }}/faultserver
        run: uv run pytest tests/faults -rxX
