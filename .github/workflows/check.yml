# This workflow will install Python dependencies, do type checking, and
# run tests with a variety of Python versions. The integration tests run
# against the greenbender/inn image and against Ubuntu's inn2 package.

name: Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]
    services:
      inn-service:
        image: greenbender/inn
        ports:
          - 119:119
          - 563:563
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run mypy
        run: uv run mypy --strict .
      - name: Run tests
        run: uv run pytest

  test-inn2:
    runs-on: ubuntu-26.04  # Its inn2 package is INN 2.7.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Set up INN
        run: sudo tests/integration/inn2/setup.sh
      - name: Install dependencies
        run: uv sync --locked
      - name: Run integration tests
        run: uv run pytest -rs tests/integration
        env:
          PYNNTP_TLS_CAFILE: /etc/news/pynntp-cert.pem
