[project]
name = "pynntp"
version = "3.3.0"
description = "NNTP Library (including compressed headers)"
authors = [{ name = "Byron Platt", email = "byron.platt@gmail.com" }]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Communications :: Usenet News",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["nntp", "usenet", "news", "yenc", "client"]
dependencies = []

[project.urls]
Homepage = "https://github.com/greenbender/pynntp"
Documentation = "https://greenbender.github.io/pynntp/"

[dependency-groups]
dev = [
    "mypy>=1.11.2",
    "pre-commit>=3.8",
    "pytest>=8.3.2",
    "ruff>=0.17.4",
    "sphinx-pyproject",
]
docs = ["myst-parser", "sphinx-autoapi", "sphinx-pyproject"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nntp"
module-root = ""

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # flake8-commas
    "CPY001",  # flake8-copyright
    "D",       # pydocstyle
    "EM",      # flake8-errmsg
    "PLW2901", # `for` loop variable overwritten
    "TRY",     # tryceratops
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
allow-magic-value-types = ["bytes", "int", "str"]
max-args = 9                                      # Default: 5

[tool.ruff.lint.per-file-ignores]
"nntp/nntp.py" = ["A002", "ARG002", "FBT"]
"tests/*" = ["FBT001", "S101", "S106", "S311"]

[tool.ruff.lint.flake8-builtins]
builtins-allowed-modules = ["types"]

[tool.sphinx-pyproject]
github_username = "greenbender"
github_repository = "pynntp"
copyright = "2024, Byron Platt"

autoapi_dirs = ["nntp"]
exclude_patterns = [
    ".*/*",
    ".DS_Store",
    "docs/_build",
    "LICENSE.rst",
    "README.md",  # Included by index.md
    "Thumbs.db",
]
extensions = ["autoapi.extension", "myst_parser", "sphinx.ext.napoleon"]

html_theme = "alabaster"

myst_enable_extensions = [
    "amsmath",
    "attrs_inline",
    "colon_fence",
    "deflist",
    "dollarmath",
    "fieldlist",
    "html_admonition",
    "html_image",
    # "linkify",
    "replacements",
    "smartquotes",
    "strikethrough",
    "substitution",
    "tasklist",
]
myst_fence_as_directive = ["include"]
suppress_warnings = ["epub.unknown_project_files"]
templates_path = ["_templates"]

[tool.sphinx-pyproject.source_suffix]
".md" = "markdown"
".rst" = "restructuredtext"
".txt" = "markdown"

[tool.pytest.ini_options]
xfail_strict = true
